</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; font-size: 17px; color: #2C3038">
<p style="margin: 0">Diplômée du <strong style="font-weight: 700; color: #15171C">master Intelligence artificielle et apprentissage automatique</strong> d'Aix-Marseille Université et de Centrale Méditerranée, je travaille à la jonction de deux questions : comment <strong style="font-weight: 700; color: #15171C">adapter efficacement un modèle</strong> à une tâche précise, et comment <strong style="font-weight: 700; color: #15171C">comprendre ce qu'il a réellement appris</strong>.</p>
<p style="margin: 0">Chez <strong style="font-weight: 700; color: #15171C">Everdian</strong>, j'ai adapté de <strong style="font-weight: 700; color: #15171C">petits modèles de langue</strong> à l'<strong style="font-weight: 700; color: #15171C">extraction d'information</strong> et à la construction de <strong style="font-weight: 700; color: #15171C">graphes de connaissances</strong> sur des données <strong style="font-weight: 700; color: #15171C">multilingues et très bruitées</strong>, sous des <strong style="font-weight: 700; color: #15171C">contraintes industrielles</strong> de coût, de latence et de déploiement. Au <strong style="font-weight: 700; color: #15171C">LIS</strong>, j'ai étudié la <strong style="font-weight: 700; color: #15171C">géométrie des représentations internes</strong> des réseaux profonds pour décrire, couche après couche, la manière dont ils transforment l'information.</p>
<p style="margin: 0">Je travaille actuellement sur un projet de <strong style="font-weight: 700; color: #15171C">découverte de médicaments</strong> qui applique les graphes de connaissances au <strong style="font-weight: 700; color: #15171C">domaine de la santé</strong>. J'ai aussi mené des projets en <strong style="font-weight: 700; color: #15171C">apprentissage par renforcement</strong>. Toutes ces expériences se rejoignent dans un même objectif : des systèmes d'IA <strong style="font-weight: 700; color: #15171C">fiables</strong>, <strong style="font-weight: 700; color: #15171C">interprétables</strong> et <strong style="font-weight: 700; color: #15171C">adaptés à leur contexte d'usage</strong>.</p>
</div>

<p style="margin: 0; font-size: 15px; color: #3B4048">Comprendre comment un réseau transforme ses représentations, comparer des architectures et rendre les décisions des modèles plus lisibles.</p>

<div style="border: 1px solid #E2E0DA; border-radius: 8px; padding: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">

<div style="border: 1px solid #E2E0DA; border-radius: 8px; padding: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">

<p style="margin: 0; font-size: 15px; color: #3B4048">Transformer des textes hétérogènes en connaissances structurées, explicites et vérifiables, qui servent aussi de support à l'explication.</p>

<p style="margin: 6px 0 0; font-size: 15px; color: #4F5560">Figures extraites de mon poster de recherche de M2, LIS et Aix-Marseille Université.</p>

<sc-if value="{{fig.archi}}">

<p style="margin: 12px 0 0; font-size: 15px; color: #3B4048">À gauche, les ResNet suivent des arcs réguliers et les VGG des chemins plus irréguliers : les deux familles occupent des régions géométriques distinctes. À droite, la trajectoire d'un ResNet se forme progressivement au fil des époques et son extrémité se rapproche de la cible. Précision des modèles : 87 à 95 % pour les ResNet, 88 à 91 % pour les VGG.</p>
</sc-if>
<sc-if value="{{fig.domaine}}">
<img src="images/poster-fig5-6.jpg" alt="Trajectoires de modèles entraînés sur CIFAR-10 et sur SVHN, évaluées sur chacun des deux jeux" style="display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid #E2E0DA; background: #FFFFFF">
<p style="margin: 12px 0 0; font-size: 15px; color: #3B4048">Un modèle entraîné sur le domaine évalué atteint toujours la cible, alors qu'un modèle venu de l'autre domaine reste loin, à un angle proche de π/2. Les cibles de deux domaines sont presque orthogonales, ce qui remet en question la distillation de connaissances entre domaines.</p>
</sc-if>
<sc-if value="{{fig.robuste}}">
<img src="images/poster-fig3.jpg" alt="Convergence des distances entre couches selon la taille de l'échantillon" style="display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid #E2E0DA; background: #FFFFFF">
<p style="margin: 12px 0 0; font-size: 15px; color: #3B4048">Les distances entre couches se stabilisent à partir d'une centaine d'exemples. Un échantillon de 128 exemples offre le meilleur compromis entre stabilité et coût en mémoire. J'ai aussi montré que l'estimateur était sensible à l'ordre des exemples et proposé une correction.</p>
</sc-if>

name: S.name, region: String(S.region), delta: String(S.delta), e: f[2 * i], r: f[2 * i + 1], eOpts: S.E, rOpts: S.R,
eLeft: (f[2 * i] / 210 * 100).toFixed(1), rLeft: (f[2 * i + 1] / 210 * 100).toFixed(1),
setE: function (ev2) { var g = f.slice(); g[2 * i] = Number(ev2.target.value); self.setState({ freq: g, solveMsg: '' }); },
setR: function (ev2) { var g = f.slice(); g[2 * i + 1] = Number(ev2.target.value); self.setState({ freq: g, solveMsg: '' }); }
};
});
var checks = ev.checks.map(function (c) { return { label: c.label, state: c.ok ? 'respectée' : 'violée', fg: c.ok ? '#155A2E' : '#9A2F0A', bg: c.ok ? '#EAF5EE' : '#FBEAE3' }; });
var HN = [1, 2, 3, 4, 5, 6].map(function (x) { return { id: x, name: String(x) }; });
var hexTabs = HN.map(function (x) {
var p = pill(x.id === st.hexN);
return { name: x.name, bg: p.bg, fg: p.fg, border: p.border, pressed: p.pressed, pick: function () { self.setState({ hexN: x.id, hexI: 0 }); } };
});
var ph = this.polyhex(st.hexN);
var mol = ph.list[st.hexI % ph.list.length];
var sz = 26, hw = Math.sqrt(3) * sz, hh = 2 * sz;
var pts2 = mol.map(function (c) { return { x: hw * (c[0] + c[1] / 2), y: 1.5 * sz * c[1] }; });
var minx = Math.min.apply(null, pts2.map(function (p2) { return p2.x; }));
var hexes = pts2.map(function (p2) { return { x: (p2.x - minx).toFixed(1), y: p2.y.toFixed(1), w: (hw - 3).toFixed(1), h: (hh - 3).toFixed(1) }; });
var molW = Math.max.apply(null, pts2.map(function (p2) { return p2.x - minx; })) + hw;
var molH = Math.max.apply(null, pts2.map(function (p2) { return p2.y; })) + hh;
var FIGS = [{ id: 'archi', name: 'Architectures' }, { id: 'domaine', name: 'Inter-domaine' }, { id: 'robuste', name: 'Robustesse' }, { id: 'poster', name: 'Poster complet' }];
var WEB = [{ id: 'wehelp', name: 'WeHELP Group' }, { id: 'elearning', name: 'Enseignement à distance' }, { id: 'citoyens', name: 'Services aux citoyens' }];
return {
accent: accent,
steps: steps,
cur: cur,
prevStep: function () { self.setState({ step: (st.step + 5) % 6 }); },
nextStep: function () { self.setState({ step: (st.step + 1) % 6 }); },
langs: langs,
segs: segs,
dir: st.lang === 'ar' ? 'rtl' : 'ltr',
langCode: st.lang,
extracted: st.extracted,
extractLabel: st.extracted ? 'Effacer' : "Lancer l'extraction",
toggleExtract: function () { self.setState({ extracted: !st.extracted }); },
figTabs: tabs(FIGS, 'fig'),
fig: flags(FIGS, 'fig'),
webTabs: tabs(WEB, 'web'),
web: flags(WEB, 'web'),
molTabs: tabs(MOLS, 'mol'),
kg: kg,
kgTitle: KGT[0],
kgText: KGT[1],
kgAlt: 'Graphe fictif : ' + KGT[0] + '. ' + KGT[1],
cells: cells,
episodes: String(st.episodes),
rlStatus: rlStatus,
rlAlt: 'Grille de cinq cases sur cinq. ' + rlStatus,
train1: function () { self2.runEpisodes(1); },
train50: function () { self2.runEpisodes(50); },
resetRl: function () { self2.resetQ(); self2.setState({ episodes: 0 }); },
stations: stations,
checks: checks,
fo1: String(ev.fo[0]),
fo2: String(ev.fo[1]),
fo3: String(ev.fo[2]),
solve1: function () { solve(0); },
solve2: function () { solve(1); },
solve3: function () { solve(2); },
solveMsg: st.solveMsg || (ev.ok ? 'Toutes les contraintes sont respectées.' : 'Certaines contraintes sont violées : modifiez les fréquences ou lancez le solveur.'),
hexTabs: hexTabs,
hexes: hexes,
molW: molW.toFixed(0),
molH: molH.toFixed(0),
molIdx: String(st.hexI % ph.list.length + 1),
molCount: String(ph.list.length),
fixedCount: String(ph.fixed),
molAlt: 'Structure de ' + st.hexN + ' cycles hexagonaux',
prevMol: function () { self.setState({ hexI: (st.hexI - 1 + ph.list.length) % ph.list.length }); },
nextMol: function () { self.setState({ hexI: (st.hexI + 1) % ph.list.length }); }
};
}
}
__mount(Component);
</script>
